query UserFollowedUsers($first: Int, $after: Cursor) {
    user {
        follows(first: $first, after: $after, order: ASC) {
            edges {
                cursor
                followedAt
                node {
                    displayName
                    id
                    self {
                        follower {
                            notificationSettings {
                                isEnabled
                            }
                        }
                    }
                    lastBroadcast {
                        startedAt
                    }
                    login
                    profileImageURL(width: 300)
                }
            }
            pageInfo {
                hasNextPage
            }
        }
    }
}
