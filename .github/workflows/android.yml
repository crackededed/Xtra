name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        filter: blob:none
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: 'basic'
    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: apk
        path: app/build/outputs/apk/release/*.apk

    - name: Generate release notes
      if: github.event_name != 'pull_request'
      run: |
        if git rev-parse --verify refs/tags/latest >/dev/null 2>&1; then
          git log refs/tags/latest..HEAD --oneline --decorate=no > notes.txt
        else
          git log --oneline --decorate=no > notes.txt
        fi

    - name: Update tag
      if: github.event_name != 'pull_request'
      run: |
        git tag -f latest
        git push -f origin tag latest

    - name: Delete release
      if: github.event_name != 'pull_request'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release delete latest -y

    - name: Create release
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create latest --title "Latest" --notes-file notes.txt --latest=true 'app/build/outputs/apk/release/*.apk'
